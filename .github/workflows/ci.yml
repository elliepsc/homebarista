name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Download NLTK data
        run: uv run python -c "import nltk; nltk.download('punkt_tab')"

      - name: Run tests (demo mode, no API key)
        run: uv run pytest -v

      - name: Smoke-test full ingestion pipeline (demo mode)
        run: uv run python -m ingestion.run_ingestion --demo

      - name: Smoke-test retrieval eval (demo mode)
        run: uv run python -m evals.run_retrieval_eval --demo
