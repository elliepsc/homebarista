[project]
name = "homebarista"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.0",
  "youtube-transcript-api>=0.6",
  "sentence-transformers>=2.7",
  "chromadb>=0.5",
  "anthropic>=0.25",
  "streamlit>=1.35",
  "pytest>=8.0",
  "python-dotenv>=1.0",
  "pydantic>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "nltk>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homebarista"]
