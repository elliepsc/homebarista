[project]
name = "homebarista"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.0",
  "youtube-transcript-api>=0.6",
  "sentence-transformers>=2.7",
  "chromadb>=0.5",
  "anthropic>=0.25",
  "streamlit>=1.35",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "nltk>=3.8",
  "rank-bm25>=0.2.2",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "ingestion", "pipeline", "orchestration"]
