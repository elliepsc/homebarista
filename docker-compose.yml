# HomeBarista Coach — everything runs in compose (grading criterion 2/2):
# the app container embeds ChromaDB in persistent mode, so the ./data volume
# is the whole database — no separate DB service needed.
services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      DEMO_MODE: "true"   # demo by default: works with zero API keys
    volumes:
      - ./data:/app/data   # ChromaDB persistence + snapshots
      - ./logs:/app/logs   # sessions.jsonl + feedback.jsonl (monitoring)
